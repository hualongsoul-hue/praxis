name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync locked dependencies
        run: uv sync --all-extras --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Dependency vulnerability audit
        run: uv run pip-audit
      - name: Public API policy and security baseline
        run: uv run pytest -W error --strict-config --strict-markers -q tests/test_public_api_policy.py tests/test_security_baseline.py
      - name: Scenarios, integration, E2E, and documentation examples
        run: uv run pytest -W error --strict-config --strict-markers -m "not live_model" tests/scenarios tests/integration tests/e2e tests/test_documentation.py
      - name: Full test suite with branch coverage
        run: uv run pytest -W error --strict-config --strict-markers -m "not live_model" --cov=praxis --cov-branch --cov-fail-under=90
      - name: Build wheel and sdist
        run: uv build

  wheel-smoke:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv build
      - run: uv run python scripts/verify_wheel.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --frozen
      - run: uv run pip-audit
      - run: uv run pytest -q tests/test_security_baseline.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
