# Praxis 配置示例
# 所有字段均有默认值，仅需配置需要覆盖的项目。
# 完整配置参考: docs/CONFIG_REFERENCE.md

# ── S2 遥测系统 ────────────────────────────────────────────
telemetry:
  log_level: "INFO"
  log_format: "text"        # "json" 用于生产环境
  log_levels:
    gateway: "INFO"
    guardrails: "INFO"
  metrics_enabled: true
  metrics_export: "file"    # "prometheus" 用于生产环境
  tracing_enabled: true
  tracing_export: "console" # "otlp" 用于生产环境
  audit_enabled: true

# ── S3 持久化引擎 ──────────────────────────────────────────
persistence:
  backend: "sqlite"
  sqlite_path: "data/praxis.db"
  # redis_url: "redis://localhost:6379/0"  # Redis 后端

# ── S4 模型网关 ────────────────────────────────────────────
gateway:
  deployments:
    - model_name: "default"
      model: "openai/glm-5.1-openai"
      api_base: "http://172.24.23.192:3000/v1"
      api_key_env: "PRAXIS_MODEL_API_KEY"   # 配置中只保存环境变量名
      default_max_output_tokens: 4096
      supports_vision: false
  default_model: "default"
  routing_strategy: "simple-shuffle"
  num_retries: 3
  timeout: 60.0
  max_concurrent_requests: 8
  # max_total_tokens: 1000000
  # max_budget: 10.0  # USD 成本上限

# ── S5 工具系统 ────────────────────────────────────────────
tools:
  allowed_paths: []        # 空 = 拒绝所有文件访问
  default_timeout: 30.0
  max_concurrent_readonly: 5
  shell_timeout: 120.0
  shell_enabled: false
  network_allowed: false
  allow_private_networks: false
  # S9 工具降级映射：首选工具不可用/熔断时切换到替代工具
  # fallback_mappings:
  #   web_search: "web_fetch"

# ── S6 记忆系统 ────────────────────────────────────────────
memory:
  embedding_api_base: null  # 未配置时使用确定性本地词法检索
  # embedding_api_key_env: "PRAXIS_EMBEDDING_API_KEY"
  max_memories: 10000
  decay_enabled: true       # 梦境周期执行相关性衰减遗忘
  background_batch_threshold: 5
  background_interval_seconds: 10.0

# ── S7 上下文引擎 ──────────────────────────────────────────
context:
  compaction_threshold: 0.8     # Token 占比超过 80% 触发压缩
  compaction_min_history: 8     # 对话历史达到此长度才检查遮蔽/压缩
  masking_turn_distance: 10
  masking_token_threshold: 2000
  recent_file_refs_keep: 5

# ── S8 护栏系统 ────────────────────────────────────────────
guardrails:
  default_permission: "confirm"  # auto_approve / confirm / deny
  input_guardrails_enabled: true
  output_guardrails_enabled: true
  # permissions_file: "permissions.yaml"  # 声明式权限配置

# ── S9 错误恢复 ────────────────────────────────────────────
recovery:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0
  circuit_breaker_threshold: 5
  circuit_breaker_cooldown: 60.0

# ── S10 验证引擎 ───────────────────────────────────────────
verification:
  computational_enabled: true
  inferential_enabled: true
  visual_enabled: false

# ── S11 编排循环 ───────────────────────────────────────────
orchestrator:
  max_turns: 100
  default_strategy: "react"  # react / plan-and-execute

# ── S12 会话管理 ───────────────────────────────────────────
session:
  auto_checkpoint: true
  max_checkpoints_per_session: 50

# ── S13 子代理 ─────────────────────────────────────────────
subagent:
  max_concurrent: 5
  default_max_turns: 50
  default_timeout: 300.0

# ── S14 技能系统 ───────────────────────────────────────────
skills:
  skill_paths:
    - ".praxis/skills"
    - "~/.praxis/skills"
  auto_discover: true
  max_skills_in_context: 10

# ── MCP 可选能力 ───────────────────────────────────────────
mcp:
  enabled: false
  connect_timeout: 30.0
  sampling_enabled: true
