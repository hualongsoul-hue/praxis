[project]
name = "praxis"
version = "1.0.0"
description = "Praxis — AI Agent Harness"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Praxis Contributors" }]
keywords = ["ai", "agent", "llm", "mcp", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.5,<3",
    # 1.101.0 builds ReadOnly TypedDict fields with Pydantic warnings before
    # sending requests; incompatible with warning-strict hosts (see upgrade notes).
    "litellm>=1.100.1,<2,!=1.101.0",
    "httpx>=0.28.1,<1",
    "aiosqlite>=0.22.1,<1",
    "sqlalchemy[asyncio]>=2.0.53,<3",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "pyyaml>=6.0.3,<7",
    "jsonschema>=4.26.0,<5",
    "json-repair>=0.63.4,<1",
]

[project.urls]
Homepage = "https://github.com/hualongsoul-hue/praxis"
Repository = "https://github.com/hualongsoul-hue/praxis"
Issues = "https://github.com/hualongsoul-hue/praxis/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0,<7",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "pip-audit>=2.10.1,<3",
    "pip>=26.2.1,<27",
    "pyright>=1.1.414,<2",
    "ruff>=0.16.7,<0.17",
    "sse-starlette==3.4.11",
]

[project.scripts]
praxis = "praxis.__main__:main"

[project.optional-dependencies]
mcp = ["mcp>=2.2.0,<3", "httpx2>=2.13.0,<3"]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<2"]
redis = ["redis>=8.1.0,<9"]
visual = ["playwright>=1.62.0,<2"]

[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict_config = true
strict_markers = true
filterwarnings = ["error"]
markers = [
    "e2e: crosses a real process or TCP socket boundary",
    "live_model: requires PRAXIS_MODEL_API_KEY and access to the configured model endpoint",
    "redis: requires a reachable Redis test service",
]

[tool.coverage.run]
branch = true
source = ["praxis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF012", "RUF100"]
ignore = [
    "ASYNC109", # timeout 是公共 API 参数；实现内部仍使用受控异步超时
    "ASYNC240", # pathlib 的轻量元数据操作不需要强制引入 anyio.Path
    "RUF001", # 中文字符串中的全角标点是有意的
    "RUF002", # 中文文档字符串中的全角标点是有意的
    "RUF003", # 中文注释中的全角标点是有意的
]

[tool.pyright]
include = ["src/praxis"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
