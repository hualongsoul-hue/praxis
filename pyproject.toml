[project]
name = "praxis"
version = "1.0.0"
description = "Praxis — AI Agent Harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "litellm>=1.50",
    "mcp>=1.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "sqlalchemy[asyncio]>=2.0",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "pyyaml>=6.0",
    "redis>=5.0",
    "jsonschema>=4.20",
    "json-repair>=0.30",
    "playwright>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
