[project]
name = "praxis"
version = "1.0.0"
description = "Praxis — AI Agent Harness"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Praxis Contributors" }]
keywords = ["ai", "agent", "llm", "mcp", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9,<3",
    "litellm>=1.84.0,<2",
    "httpx>=0.27,<1",
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    "json-repair>=0.60.1,<1",
]

[project.urls]
Homepage = "https://github.com/hualongsoul-hue/praxis"
Repository = "https://github.com/hualongsoul-hue/praxis"
Issues = "https://github.com/hualongsoul-hue/praxis/issues"

[dependency-groups]
dev = [
    "hypothesis>=6.135,<7",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.9",
    "pip>=26.2",
    "pyright>=1.1.403",
    "ruff>=0.12",
]

[project.scripts]
praxis = "praxis.__main__:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2"]
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.27"]
redis = ["redis>=5.0,<8"]
visual = ["playwright>=1.40,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
strict_config = true
strict_markers = true
filterwarnings = ["error"]
markers = [
    "e2e: crosses a real process or TCP socket boundary",
    "live_model: requires PRAXIS_MODEL_API_KEY and access to the configured model endpoint",
    "redis: requires a reachable Redis test service",
]

[tool.coverage.run]
branch = true
source = ["praxis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC", "RUF012", "RUF100"]
ignore = [
    "ASYNC109", # timeout 是公共 API 参数；实现内部仍使用受控异步超时
    "ASYNC240", # pathlib 的轻量元数据操作不需要强制引入 anyio.Path
    "RUF001", # 中文字符串中的全角标点是有意的
    "RUF002", # 中文文档字符串中的全角标点是有意的
    "RUF003", # 中文注释中的全角标点是有意的
]

[tool.pyright]
include = ["src/praxis"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
